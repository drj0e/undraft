name: Veto queued post

# When Joe closes a "Review: <slug>" issue as "Not planned", pull that post:
# set draft: true so it never publishes. Guarded: only acts on a still-queued
# (future-dated) post, so closing the issue of an already-live post is a no-op
# (no accidental unpublish). Closing as "Completed" does nothing here.

on:
  issues:
    types: [closed]

permissions:
  contents: write
  issues: write

jobs:
  veto:
    if: github.event.issue.state_reason == 'not_planned' && startsWith(github.event.issue.title, 'Review: ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Pull the post if it is still queued
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.issue.title }}
          NUM: ${{ github.event.issue.number }}
        run: |
          set -eu
          slug="${TITLE#Review: }"
          f="blog/content/posts/${slug}.md"
          today=$(date -u +%Y-%m-%d)
          if [ ! -f "$f" ]; then
            gh issue comment "$NUM" --body "No post file for \`$slug\`; nothing to pull."
            exit 0
          fi
          pdate=$(grep -m1 '^date:' "$f" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          if [ "$pdate" \> "$today" ]; then
            if grep -qm1 '^draft:' "$f"; then
              sed -i 's/^draft:.*/draft: true/' "$f"
            else
              sed -i '/^date:/a draft: true' "$f"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$f"
            git commit -m "Hold ${slug}: vetoed via issue #${NUM}"
            git push
            gh issue comment "$NUM" --body "Pulled \`$slug\` — set to draft, it will not publish."
          else
            gh issue comment "$NUM" --body "\`$slug\` is already live (dated $pdate); not pulling. Edit the post directly to remove it."
          fi
