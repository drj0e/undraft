baseURL = "https://josephcapozzoli.com/"
languageCode = "en-us"
title = "Joe Capozzoli"
theme = "PaperMod"
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  author = "Joe Capozzoli"
  description = "Architecture, AI, and the things that actually happen when you build enterprise software."
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  defaultTheme = "light"
  disableSpecial1stPost = true
  hideFooter = false

  [[params.footerLinks]]
    name = "GitHub"
    url = "https://github.com/drj0e"
    external = true
  [[params.footerLinks]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/josephcapozzoli/"
    external = true
  [[params.footerLinks]]
    name = "Now"
    url = "/now/"

# homeInfoParams removed — homepage goes straight to post list
# Bio lives on the About page

[params.assets]
  disableFingerprinting = false

[params.footer]
  hideCopyright = false

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 2
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 3
  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 4
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 5
